services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-calora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calora}
    networks:
      - shared_net
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: calora_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-calora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calora}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-pro}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      AI_CACHE_TTL_HOURS: ${AI_CACHE_TTL_HOURS:-24}
      AI_PRICE_INPUT_PER_M: ${AI_PRICE_INPUT_PER_M:-0.27}
      AI_PRICE_INPUT_CACHE_HIT_PER_M: ${AI_PRICE_INPUT_CACHE_HIT_PER_M:-0.07}
      AI_PRICE_OUTPUT_PER_M: ${AI_PRICE_OUTPUT_PER_M:-1.10}
      APP_URL: ${APP_URL:-http://localhost}
      NODE_ENV: production
      PORT: "${API_PORT:-3010}"
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-privacy@calora.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "${API_PORT:-3010}"
    networks:
      - shared_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${API_PORT:-3010}/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: calora_web
    restart: unless-stopped
    networks:
      - shared_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  shared_net:
    external: true
